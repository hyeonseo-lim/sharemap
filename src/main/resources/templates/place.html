<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title th:text="${place.name}">Place</title>

  <style>
    body { font-family:sans-serif; max-width:600px; margin:0 auto; padding:20px; }

    .back-btn {
      padding:10px 15px;
      background:#4CAF50;
      color:white;
      border-radius:10px;
      text-decoration:none;
    }

    .rating {
      font-size:18px;
      margin:15px 0;
      color:#f5a623;
    }

    .place-img {
      width:100%;
      height:200px;
      object-fit:cover;
      border-radius:12px;
      margin-top:15px;
    }

    .review-box {
      background:#f9f9f9;
      padding:15px;
      border-radius:10px;
    }

    .review-box textarea {
      width:100%;
      height:80px;
      margin-top:10px;
    }

    .review-btn {
      margin-top:10px;
      padding:10px 20px;
      background:#4CAF50;
      color:white;
      border:none;
      border-radius:10px;
    }

    .review-item {
      margin-top:15px;
      padding:15px;
      background:#f5f5f5;
      border-radius:10px;
    }

    .review-item button {
      margin-right:5px;
      padding:5px 10px;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<a class="back-btn" href="/">← back</a>

<h2 th:text="${place.name}"></h2>


<img th:if="${place.imageUrl != null}"
     th:src="@{${place.imageUrl}}"
     class="place-img">

<div style="
    margin-top: 15px;
    padding: 15px;
    background: #f9f9f9;
    border-radius: 12px;
    line-height: 1.8;
">
  <div>🏷️ <b>카테고리</b> : <span th:text="${place.category}"></span></div>
  <div>📞 <b>전화번호</b> : <span th:text="${place.phone}"></span></div>
  <div>📍 <b>주소</b> : <span th:text="${place.address}"></span></div>
  <div>⏰ <b>영업시간</b> : <span th:text="${place.businessHours}"></span></div>
</div>

<div class="rating" id="ratingBox">
  ⭐ [[${place.rating}]] / 5.0
</div>

<hr>

<div class="review-box">
  <h3>리뷰 작성</h3>

  <select id="star">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>

  <textarea id="content"></textarea>

  <button class="review-btn" onclick="sendReview()">등록</button>
</div>

<hr>

<div id="reviewList"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">

  let placeId = [[${place.id}]];
  let loginUser = [[${loginUser != null ? loginUser.username : ''}]];
  let loginNickname = [[${loginUser != null ? loginUser.nickname : ''}]];

  let stompClient = null;

  window.onload = function () {
      connect();
      loadReviews();
  };

  function loadReviews() {
      fetch("/api/review/" + placeId)
          .then(res => res.json())
          .then(data => render(data));
  }

  function connect() {

      let socket = new SockJS("/ws");
      stompClient = Stomp.over(socket);

      stompClient.connect({}, function () {

          stompClient.subscribe("/topic/review/" + placeId, function (msg) {
              render(JSON.parse(msg.body));
          });

          stompClient.subscribe("/topic/rating/" + placeId, function (msg) {
              document.getElementById("ratingBox").innerText =
                  "⭐ " + JSON.parse(msg.body) + " / 5.0";
          });
      });
  }

  function render(list) {

      const box = document.getElementById("reviewList");
      box.innerHTML = "";

      list.forEach(r => {

          const isMine = loginUser && r.username === loginUser;

          box.innerHTML += `
            <div class="review-item">
                <b>${r.nickname ?? 'user'}</b>
                <div>⭐ ${r.star}</div>
                <div>${r.content}</div>

                ${isMine ? `
                    <button onclick="editReview(${r.id})">수정</button>
                    <button onclick="deleteReview(${r.id})">삭제</button>
                ` : ""}
            </div>
          `;
      });
  }

  function sendReview() {

      if (!loginUser) {
          alert("로그인 필요");
          return;
      }

      stompClient.send("/app/review/add", {}, JSON.stringify({
          placeId: placeId,
          star: Number(document.getElementById("star").value),
          content: document.getElementById("content").value,
          username: loginUser,
          nickname: loginNickname
      }));

      document.getElementById("content").value = "";
  }

  function editReview(id) {

      if (!loginUser) return;

      let star = prompt("별점 (1~5)");
      let content = prompt("내용");

      if (!star || !content) return;

      stompClient.send("/app/review/edit", {}, JSON.stringify({
          id: Number(id),
          star: Number(star),
          content: content
      }));
  }

  function deleteReview(id) {

      if (!loginUser) return;

      stompClient.send("/app/review/delete", {}, JSON.stringify({
          id: Number(id)
      }));
  }

</script>

</body>
</html>
