<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title th:text="${place.name}">장소 정보</title>

  <style>
    body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
    }

    .back-btn {
        display: inline-block;
        margin-bottom: 20px;
        padding: 10px 15px;
        background: #4CAF50;
        color: white;
        text-decoration: none;
        border-radius: 10px;
    }

    .rating {
        color: #f5a623;
        font-size: 18px;
        margin-bottom: 15px;
    }

    .review-box textarea {
        width: 100%;
        height: 100px;
        padding: 10px;
        border-radius: 10px;
    }

    .review-btn {
        margin-top: 10px;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: #4CAF50;
        color: white;
        cursor: pointer;
    }

    #favButton {
        margin: 10px 0;
        padding: 10px 15px;
        border: none;
        border-radius: 10px;
        background: gold;
        cursor: pointer;
        font-weight: bold;
    }

    .review-item {
        margin-top: 15px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 10px;
    }
  </style>

</head>

<body>

<a href="/" class="back-btn">← 지도로 돌아가기</a>

<h2 th:text="${place.name}"></h2>

<button id="favButton" onclick="toggleFavorite()">
  ⭐ 즐겨찾기
</button>

<img th:if="${place.imageUrl != null}"
     th:src="${place.imageUrl}"
     style="width:100%; height:200px; object-fit:cover; border-radius:12px;">

<div class="rating" id="ratingBox">
  ⭐ [[${place.rating}]] / 5.0
</div>

<hr>

<!-- 리뷰 작성 -->
<div class="review-box">
  <h3>리뷰 작성</h3>

  <select id="star">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>

  <textarea id="content" placeholder="리뷰 작성"></textarea>

  <button class="review-btn" onclick="sendReview()">
    등록
  </button>
</div>

<hr>

<!-- 리뷰 리스트 -->
<div id="reviewList">

  <div th:each="r : ${reviews}" class="review-item">

    <b th:text="${r.nickname}"></b>

    <div>⭐ <span th:text="${r.star}"></span></div>

    <div th:text="${r.content}"></div>

    <div th:if="${loginUser != null and loginUser.username == r.username}">
      <button th:attr="onclick=|editReview(${r.id})|">수정</button>
      <button th:attr="onclick=|deleteReview(${r.id})|">삭제</button>
    </div>

  </div>

</div>

<!-- WebSocket -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">

  let placeId = [[${place.id}]];
  let loginUser = [[${loginUser != null ? loginUser.username : null}]];
  let loginNickname = [[${loginUser != null ? loginUser.nickname : null}]];

  // =========================
  // FAVORITE
  // =========================
  window.onload = function () {
      initFavoriteButton();
  };

  function initFavoriteButton() {

      fetch("/api/favorite")
          .then(res => res.json())
          .then(list => {

              const btn = document.getElementById("favButton");

              if (list.includes(Number(placeId))) {
                  btn.innerText = "💛 즐겨찾기됨";
              } else {
                  btn.innerText = "⭐ 즐겨찾기";
              }
          });
  }

  function toggleFavorite() {

      fetch("/api/favorite/" + placeId, {
          method: "POST"
      })
      .then(() => initFavoriteButton());
  }

  // =========================
  // WEBSOCKET
  // =========================
  let stompClient = null;

  function connect() {

      let socket = new SockJS("/ws");
      stompClient = Stomp.over(socket);

      stompClient.connect({}, function () {

          stompClient.subscribe("/topic/review/" + placeId, function (msg) {
              render(JSON.parse(msg.body));
          });

      });
  }

  // =========================
  // REVIEW ADD
  // =========================
  function sendReview() {

      stompClient.send("/app/review/add", {}, JSON.stringify({
          placeId: placeId,
          star: document.getElementById("star").value,
          content: document.getElementById("content").value,
          username: loginUser,
          nickname: loginNickname
      }));

      document.getElementById("content").value = "";
  }

  // =========================
  // REVIEW EDIT
  // =========================
  function editReview(id) {

      let star = prompt("별점 (1~5)");
      let content = prompt("내용");

      stompClient.send("/app/review/edit", {}, JSON.stringify({
          id: id,
          star: star,
          content: content
      }));
  }

  // =========================
  // REVIEW DELETE
  // =========================
  function deleteReview(id) {

      stompClient.send("/app/review/delete", {}, JSON.stringify({
          id: id
      }));
  }

  // =========================
  // RENDER
  // =========================
  function render(list) {

      let box = document.getElementById("reviewList");
      box.innerHTML = "";

      list.forEach(r => {

          let btn = "";

          if (r.username === loginUser) {
              btn = `
                  <button onclick="editReview(${r.id})">수정</button>
                  <button onclick="deleteReview(${r.id})">삭제</button>
              `;
          }

          box.innerHTML += `
              <div class="review-item">
                  <b>${r.nickname}</b>
                  <div>⭐ ${r.star}</div>
                  <div>${r.content}</div>
                  ${btn}
              </div>
          `;
      });
  }

  // =========================
  // START
  // =========================
  if (loginUser != null) {
      connect();
  }

  initFavoriteButton();

</script>

</body>
</html>
