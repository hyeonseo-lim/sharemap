<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title th:text="${place.name}">
    Place
  </title>


  <style>

    body {
        font-family:sans-serif;
        max-width:600px;
        margin:0 auto;
        padding:20px;
    }


    .back-btn {
        padding:10px 15px;
        background:#4CAF50;
        color:white;
        border-radius:10px;
        text-decoration:none;
    }


    .rating {
        font-size:18px;
        margin:15px 0;
        color:#f5a623;
    }


    .place-img {
        width:100%;
        height:200px;
        object-fit:cover;
        border-radius:12px;
        margin-top:15px;
    }


    .review-box {
        background:#f9f9f9;
        padding:15px;
        border-radius:10px;
    }


    .review-box textarea {
        width:100%;
        height:80px;
        margin-top:10px;
    }


    .review-btn {

        margin-top:10px;
        padding:10px 20px;
        background:#4CAF50;
        color:white;
        border:none;
        border-radius:10px;

    }


    .favorite-btn {

        margin-top:10px;
        padding:10px 20px;
        background:#ff5a7a;
        color:white;
        border:none;
        border-radius:10px;

    }


    .review-item {

        margin-top:15px;
        padding:15px;
        background:#f5f5f5;
        border-radius:10px;

    }


    .review-item button {

        margin-right:5px;

    }



  </style>

</head>


<body>


<a class="back-btn" href="/">
  ← back
</a>



<h2 th:text="${place.name}"></h2>



<img th:if="${place.imageUrl != null}"
     th:src="@{${place.imageUrl}}"
     class="place-img">





<div style="
margin-top:15px;
padding:15px;
background:#f9f9f9;
border-radius:12px;
line-height:1.8;
">


  <div>
    🏷️ <b>카테고리</b> :
    <span th:text="${place.category}"></span>
  </div>


  <div>
    📞 <b>전화번호</b> :
    <span th:text="${place.phone}"></span>
  </div>


  <div>
    📍 <b>주소</b> :
    <span th:text="${place.address}"></span>
  </div>


  <div>
    ⏰ <b>영업시간</b> :
    <span th:text="${place.businessHours}"></span>
  </div>


</div>





<div class="rating" id="ratingBox">

  ⭐ [[${place.rating}]] / 5.0

</div>



<button id="favoriteBtn"
        class="favorite-btn"
        onclick="toggleFavorite()">

  🤍 즐겨찾기

</button>
<hr>


<div class="review-box">


  <h3>리뷰 작성</h3>


  <select id="star">

    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>

  </select>



  <textarea id="content"></textarea>



  <button class="review-btn"
          onclick="sendReview()">

    등록

  </button>


</div>



<hr>



<div id="reviewList"></div>





<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>




<script th:inline="javascript">


  let placeId = /*[[${place.id}]]*/ 0;


  let loginUser =
  /*[[${loginUser != null ? loginUser.username : ''}]]*/ "";


  let loginNickname =
  /*[[${loginUser != null ? loginUser.nickname : ''}]]*/ "";



  let stompClient = null;





  window.onload = function(){


      connect();


      loadReviews();


      loadFavorite();


  };






  // 리뷰 불러오기

  function loadReviews(){


      fetch("/api/review/" + placeId)


      .then(res=>res.json())


      .then(data=>{


          render(data);


      });


  }








  // WebSocket 연결

  function connect(){



      let socket =
          new SockJS("/ws");



      stompClient =
          Stomp.over(socket);





      stompClient.connect({},function(){



          stompClient.subscribe(

              "/topic/review/" + placeId,


              function(msg){


                  render(
                      JSON.parse(msg.body)
                  );


              }

          );





          stompClient.subscribe(

              "/topic/rating/" + placeId,


              function(msg){


                  document.getElementById("ratingBox")
                  .innerText =

                  "⭐ "
                  +
                  JSON.parse(msg.body)
                  +
                  " / 5.0";


              }

          );



      });



  }









  // 리뷰 출력

  function render(list){


      let box =
      document.getElementById("reviewList");



      box.innerHTML="";





      list.forEach(r=>{



          let isMine =
          loginUser &&
          r.username === loginUser;





          box.innerHTML += `


          <div class="review-item">


              <b>
              ${r.nickname ?? 'user'}
              </b>



              <div>
              ⭐ ${r.star}
              </div>



              <div>
              ${r.content}
              </div>



              ${
              isMine
              ?
              `

              <button onclick="editReview(${r.id})">
              수정
              </button>


              <button onclick="deleteReview(${r.id})">
              삭제
              </button>

              `
              :
              ""
              }


          </div>


          `;



      });


  }









  // 리뷰 등록

  function sendReview(){



      if(!loginUser){

          alert("로그인 필요");

          return;

      }



      stompClient.send(


          "/app/review/add",


          {},



          JSON.stringify({



              placeId:placeId,


              star:Number(
              document.getElementById("star").value
              ),


              content:
              document.getElementById("content").value,


              username:loginUser,


              nickname:loginNickname



          })


      );



      document.getElementById("content").value="";


  }








  // 리뷰 수정

  function editReview(id){



      let star =
      prompt("별점");


      let content =
      prompt("내용");



      if(!star || !content)
          return;




      stompClient.send(


          "/app/review/edit",


          {},



          JSON.stringify({


              id:Number(id),


              star:Number(star),


              content:content


          })


      );


  }









  // 리뷰 삭제

  function deleteReview(id){



      stompClient.send(


          "/app/review/delete",


          {},



          JSON.stringify({


              id:Number(id)


          })


      );


  }
  // =======================
// 즐겨찾기 상태 확인
// =======================

function loadFavorite(){


    if(!loginUser){

        return;

    }



    fetch("/api/favorite")


    .then(res => res.json())


    .then(list => {


        let btn =
        document.getElementById("favoriteBtn");



        if(!btn){

            return;

        }



        if(list.includes(Number(placeId))){


            btn.innerText =
            "❤️ 즐겨찾기됨";


        }


    });


}







// =======================
// 즐겨찾기 추가 / 취소
// =======================

function toggleFavorite(){


    if(!loginUser){


        alert("로그인 필요");


        return;

    }




    fetch("/api/favorite/" + placeId, {

        method:"POST"

    })



    .then(res => res.text())



    .then(msg => {



        let btn =
        document.getElementById("favoriteBtn");



        if(msg === "즐겨찾기 추가"){



            btn.innerText =
            "❤️ 즐겨찾기됨";



        }


        else if(msg === "즐겨찾기 해제"){



            btn.innerText =
            "🤍 즐겨찾기";



        }



        alert(msg);



    });



}



</script>


</body>

</html>
