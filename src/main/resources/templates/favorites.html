<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${place.name}">장소 정보</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 5px;
        }

        .rating {
            color: #f5a623;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .review-box textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            resize: none;
        }

        .review-btn {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }

        #favButton {
            margin: 10px 0;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: gold;
            cursor: pointer;
            font-weight: bold;
        }

        .review-item {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f5f5;
        }

        .review-star {
            color: orange;
        }
    </style>
</head>

<body>

<!-- 뒤로가기 -->
<a href="/" class="back-btn">← 지도로 돌아가기</a>

<!-- ========================= -->
<!-- 장소 정보 -->
<!-- ========================= -->

<h2 th:text="${place.name}"></h2>

<!-- ⭐ 즐겨찾기 -->
<button onclick="toggleFavorite()" id="favButton">
    ⭐ 즐겨찾기
</button>

<!-- 이미지 -->
<img th:if="${place.imageUrl != null}"
     th:src="${place.imageUrl}"
     style="width:100%; height:200px; object-fit:cover; border-radius:12px;">

<img th:if="${place.imageUrl == null}"
     src="/images/default.jpg"
     style="width:100%; height:200px; object-fit:cover; border-radius:12px;">

<div class="rating" id="ratingBox">
    ⭐ [[${place.rating}]] / 5.0
</div>

<table>
    <tr>
        <td>카테고리</td>
        <td th:text="${place.category}"></td>
    </tr>
    <tr>
        <td>전화번호</td>
        <td th:text="${place.phone}"></td>
    </tr>
    <tr>
        <td>주소</td>
        <td th:text="${place.address}"></td>
    </tr>
    <tr>
        <td>영업시간</td>
        <td th:text="${place.businessHours}"></td>
    </tr>
</table>

<hr>

<!-- ========================= -->
<!-- 리뷰 -->
<!-- ========================= -->

<div class="review-box">

    <h3>리뷰 작성</h3>

    <select id="star">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>

    <textarea id="content" placeholder="리뷰 작성"></textarea>

    <button class="review-btn" onclick="sendReview()">등록</button>

</div>

<hr>

<div id="reviewList">

    <div th:each="r : ${reviews}" class="review-item">

        <b th:text="${r.nickname}"></b>

        <div class="review-star" th:text="'⭐ ' + ${r.star}"></div>

        <div th:text="${r.content}"></div>

        <div th:if="${loginUser != null and loginUser.username == r.username}">
            <button th:attr="onclick=|editReview(${r.id})|">수정</button>
            <button th:attr="onclick=|deleteReview(${r.id})|">삭제</button>
        </div>

    </div>

</div>

<!-- ========================= -->
<!-- WebSocket -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">

    let stompClient = null;

    let placeId = [[${place.id}]];
    let loginUser = [[${loginUser != null ? loginUser.username : null}]];
    let loginNickname = [[${loginUser != null ? loginUser.nickname : null}]];

    // =========================
    // WebSocket 연결
    // =========================

    function connect() {

        let socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {

            stompClient.subscribe("/topic/review/" + placeId, function (msg) {

                let reviews = JSON.parse(msg.body);

                render(reviews);

            });

        });

    }

    // =========================
    // 리뷰 렌더링
    // =========================

    function render(list) {

        let box = document.getElementById("reviewList");

        box.innerHTML = "";

        let total = 0;

        list.forEach(r => {

            total += Number(r.star);

            let html = `
            <div class="review-item">

                <b>${r.nickname}</b>

                <div class="review-star">
                    ⭐ ${r.star}
                </div>

                <div>${r.content}</div>
            `;

            if (r.username === loginUser) {

                html += `
                    <button onclick="editReview(${r.id})">
                        수정
                    </button>

                    <button onclick="deleteReview(${r.id})">
                        삭제
                    </button>
                `;
            }

            html += `</div>`;

            box.innerHTML += html;

        });

        let avg =
            list.length > 0
            ? (total / list.length).toFixed(1)
            : 0;

        document.getElementById("ratingBox").innerHTML =
            `⭐ ${avg} / 5.0`;

    }

    // =========================
    // 리뷰 추가
    // =========================

    function sendReview() {

        stompClient.send("/app/review/add", {}, JSON.stringify({

            placeId: placeId,
            star: document.getElementById("star").value,
            content: document.getElementById("content").value,
            username: loginUser,
            nickname: loginNickname

        }));

        document.getElementById("content").value = "";

    }

    // =========================
    // 즐겨찾기 추가 / 해제
    // =========================

    function toggleFavorite() {

        fetch("/api/favorite/" + placeId, {
            method: "POST"
        })
        .then(res => res.text())
        .then(msg => {

            alert(msg);

            const btn =
                document.getElementById("favButton");

            if (msg.includes("추가")) {

                btn.innerText =
                    "⭐ 즐겨찾기 해제";

            }

            if (msg.includes("해제")) {

                btn.innerText =
                    "⭐ 즐겨찾기";

            }

        })
        .catch(err => {

            console.error(err);

            alert("오류 발생");

        });

    }

    // =========================
    // 현재 즐겨찾기 상태 확인
    // =========================

    fetch("/api/favorite")
        .then(res => res.json())
        .then(list => {

            const btn =
                document.getElementById("favButton");

            if (list.includes(placeId)) {

                btn.innerText =
                    "⭐ 즐겨찾기 해제";

            }

        });

    // 시작
    connect();

</script>

</body>
</html>
